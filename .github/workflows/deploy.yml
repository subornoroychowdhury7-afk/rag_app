name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Deploy Frontend to GitHub Pages
  # -------------------------------------------------------------
  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export for GitHub Pages
        working-directory: frontend
        env:
          OUTPUT_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          : "${NEXT_PUBLIC_API_URL:=https://rag-app-1-rqg6.onrender.com}"
          export NEXT_PUBLIC_API_URL
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker image to GitHub Packages (GHCR)
  # -------------------------------------------------------------
  publish-ghcr:
    name: Publish Container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/backend:latest
            ghcr.io/${{ steps.repo.outputs.NAME }}/backend:${{ github.sha }}

  # -------------------------------------------------------------
  # Job 3: Trigger Render Backend Deployment (if hook configured)
  # -------------------------------------------------------------
  trigger-render-deploy:
    name: Trigger Render Redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment webhook..."
          curl -fsS -X POST "$RENDER_HOOK"
          echo "Render deploy triggered successfully."

      - name: Notice if hook not set
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL secret not set; relying on Render's native Git push auto-deploy."

  # -------------------------------------------------------------
  # Job 4: Deploy Frontend to Vercel (if token configured)
  # -------------------------------------------------------------
  deploy-vercel:
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel --prod --token "$VERCEL_TOKEN" --confirm

      - name: Notice if Vercel token not set
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "VERCEL_TOKEN secret not set; relying on Vercel's native Git push auto-deploy."
