<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient: deep indigo to violet -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Inner glow gradient -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Document page gradient -->
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- Neural spark gradient -->
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Outer shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="#312e81" flood-opacity="0.3"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Glow filter for the neural nodes -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle inner glow ring -->
  <rect x="28" y="28" width="456" height="456" rx="84" ry="84" fill="none" stroke="url(#glow)" stroke-width="2"/>

  <!-- Document page shape (folded corner) -->
  <path d="M 152 96 L 320 96 L 368 144 L 368 416 L 152 416 Z" fill="url(#page)" opacity="0.95" filter="url(#innerShadow)"/>
  <!-- Folded corner triangle -->
  <path d="M 320 96 L 368 144 L 320 144 Z" fill="#c7d2fe" opacity="0.8"/>

  <!-- Text lines on document (representing content) -->
  <rect x="180" y="168" width="148" height="8" rx="4" fill="#a5b4fc" opacity="0.6"/>
  <rect x="180" y="192" width="120" height="8" rx="4" fill="#a5b4fc" opacity="0.5"/>
  <rect x="180" y="216" width="156" height="8" rx="4" fill="#a5b4fc" opacity="0.6"/>
  <rect x="180" y="240" width="100" height="8" rx="4" fill="#a5b4fc" opacity="0.4"/>
  <rect x="180" y="264" width="140" height="8" rx="4" fill="#a5b4fc" opacity="0.55"/>

  <!-- Highlighted/found text line (search result) -->
  <rect x="176" y="290" width="164" height="16" rx="4" fill="#fbbf24" opacity="0.3"/>
  <rect x="180" y="294" width="156" height="8" rx="4" fill="#f59e0b" opacity="0.9"/>

  <rect x="180" y="320" width="130" height="8" rx="4" fill="#a5b4fc" opacity="0.5"/>
  <rect x="180" y="344" width="148" height="8" rx="4" fill="#a5b4fc" opacity="0.45"/>
  <rect x="180" y="368" width="110" height="8" rx="4" fill="#a5b4fc" opacity="0.4"/>

  <!-- AI Brain / Neural network overlay (right side, overlapping document) -->
  <!-- Neural connection lines -->
  <g stroke="#c084fc" stroke-width="2.5" opacity="0.7">
    <line x1="340" y1="200" x2="388" y2="168"/>
    <line x1="340" y1="200" x2="400" y2="224"/>
    <line x1="340" y1="200" x2="372" y2="256"/>
    <line x1="388" y1="168" x2="424" y2="132"/>
    <line x1="388" y1="168" x2="432" y2="196"/>
    <line x1="400" y1="224" x2="432" y2="196"/>
    <line x1="400" y1="224" x2="440" y2="260"/>
    <line x1="372" y1="256" x2="440" y2="260"/>
    <line x1="372" y1="256" x2="396" y2="312"/>
    <line x1="440" y1="260" x2="432" y2="196"/>
    <line x1="396" y1="312" x2="440" y2="260"/>
    <line x1="396" y1="312" x2="360" y2="360"/>
    <line x1="396" y1="312" x2="436" y2="340"/>
    <line x1="436" y1="340" x2="440" y2="260"/>
    <line x1="360" y1="360" x2="436" y2="340"/>
  </g>

  <!-- Neural nodes -->
  <g filter="url(#nodeGlow)">
    <!-- Primary hub node -->
    <circle cx="340" cy="200" r="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <!-- Secondary nodes -->
    <circle cx="388" cy="168" r="7" fill="#c7d2fe" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="400" cy="224" r="7" fill="#c7d2fe" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="372" cy="256" r="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="432" cy="196" r="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="424" cy="132" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <circle cx="440" cy="260" r="7" fill="#c7d2fe" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="396" cy="312" r="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="360" cy="360" r="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="436" cy="340" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  </g>

  <!-- Magnifying glass / search lens -->
  <g transform="translate(108, 280)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.9"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#spark)" stroke-width="4" opacity="0.6"/>
    <line x1="30" y1="30" x2="60" y2="60" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="30" y1="30" x2="60" y2="60" stroke="url(#spark)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Sparkle inside lens -->
    <circle cx="-8" cy="-12" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="10" cy="-4" r="2" fill="#fde68a" opacity="0.6"/>
  </g>

  <!-- Small sparkle accents around the icon -->
  <g fill="#fbbf24" opacity="0.7">
    <path d="M 440 100 l 4 12 l 4 -12 l -12 4 l 12 4 Z" transform="scale(1.2) translate(-70, -15)"/>
    <circle cx="460" cy="380" r="3"/>
    <circle cx="88" cy="140" r="2.5"/>
    <circle cx="100" cy="420" r="2"/>
  </g>
</svg>
