services:
  - type: web
    name: docqa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: docqa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CHROMA_PATH
        value: /var/data/chroma_db
      - key: GEMINI_API_KEY
        sync: false
